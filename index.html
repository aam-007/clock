<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Timer</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ff3b1f;
      --accent: #ffcf33;
      --secondary: #2b65ff;
      --glow: rgba(255, 59, 31, 0.95);
      --glow-soft: rgba(255, 59, 31, 0.35);
      --panel: rgba(8, 8, 12, 0.94);
      --muted: rgba(255, 255, 255, 0.42);
      --font-main: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --tracking: 0.08em;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-family: var(--font-main);
    }

    body {
      display: grid;
      place-items: center;
      user-select: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(30, 50, 120, 0.055), transparent 28%),
        radial-gradient(circle at 48% 52%, rgba(255, 30, 0, 0.03), transparent 35%),
        #000000;
      pointer-events: none;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.065;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 100% 3px;
      mix-blend-mode: screen;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 34%, rgba(0,0,0,0.24) 58%, rgba(0,0,0,0.95) 82%);
    }

    main {
      position: relative;
      z-index: 2;
      width: min(92vw, 1100px);
      text-align: center;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(5rem, 18vw, 13rem);
      font-weight: 700;
      letter-spacing: var(--tracking);
      line-height: 0.95;
      color: var(--text);
      text-shadow:
        0 0 2px var(--text),
        0 0 8px var(--glow),
        0 0 18px var(--glow),
        0 0 42px var(--glow-soft),
        0 0 82px var(--glow-soft);
      transition:
        color 300ms ease,
        text-shadow 300ms ease,
        transform 300ms ease;
      will-change: contents;
    }

    .timer.running {
      animation:
        breathe 3.4s ease-in-out infinite,
        flicker 6.2s linear infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.004);
      }
    }

    /* Subtle irregular neon flicker: alive, but never distracting. */
    @keyframes flicker {
      0%, 7%, 11%, 19%, 27%, 42%, 58%, 73%, 86%, 100% {
        opacity: 1;
        filter: brightness(1);
        text-shadow:
          0 0 2px var(--text),
          0 0 8px var(--glow),
          0 0 18px var(--glow),
          0 0 42px var(--glow-soft),
          0 0 82px var(--glow-soft);
      }

      8% {
        opacity: 0.975;
        filter: brightness(0.94);
        text-shadow:
          0 0 2px var(--text),
          0 0 7px var(--glow),
          0 0 15px var(--glow),
          0 0 34px var(--glow-soft),
          0 0 68px var(--glow-soft);
      }

      20% {
        opacity: 0.985;
        filter: brightness(1.04);
      }

      43% {
        opacity: 0.965;
        filter: brightness(0.91);
        text-shadow:
          0 0 2px var(--text),
          0 0 6px var(--glow),
          0 0 13px var(--glow),
          0 0 29px var(--glow-soft),
          0 0 58px var(--glow-soft);
      }

      44% {
        opacity: 0.995;
        filter: brightness(1.05);
      }

      74% {
        opacity: 0.98;
        filter: brightness(0.95);
      }

      87% {
        opacity: 0.97;
        filter: brightness(0.93);
      }
    }

    .controls {
      margin-top: 3.6rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      min-height: 3rem;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .controls.hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    button {
      appearance: none;
      border: 1px solid currentColor;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 0.95rem 1.3rem;
      cursor: pointer;
      border-radius: 0;
      box-shadow:
        0 0 7px color-mix(in srgb, currentColor 50%, transparent),
        inset 0 0 10px color-mix(in srgb, currentColor 10%, transparent);
      text-shadow: 0 0 7px currentColor;
      transition:
        opacity 160ms ease,
        transform 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
    }

    button:hover {
      background: color-mix(in srgb, currentColor 8%, transparent);
      box-shadow:
        0 0 12px color-mix(in srgb, currentColor 70%, transparent),
        0 0 28px color-mix(in srgb, currentColor 20%, transparent),
        inset 0 0 12px color-mix(in srgb, currentColor 12%, transparent);
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      color: var(--secondary);
    }

    .settings {
      position: fixed;
      right: 1.2rem;
      bottom: 1.2rem;
      z-index: 5;
      width: min(340px, calc(100vw - 2.4rem));
      max-height: min(72vh, 640px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.16) transparent;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.12);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      box-shadow:
        0 0 40px rgba(0,0,0,0.75),
        0 0 30px color-mix(in srgb, var(--secondary) 10%, transparent);
    }

    .settings.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .settings h2 {
      margin: 0 0 0.9rem;
      font-size: 0.66rem;
      color: var(--muted);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .presets {
      display: grid;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .preset {
      width: 100%;
      text-align: left;
      padding: 0.75rem 0.8rem;
      color: rgba(255,255,255,0.76);
      border-color: rgba(255,255,255,0.14);
      box-shadow: none;
      text-shadow: none;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
    }

    .preset:hover {
      border-color: currentColor;
      color: var(--accent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.7rem;
    }

    .row label {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.58);
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    input[type="color"] {
      width: 42px;
      height: 28px;
      border: 1px solid rgba(255,255,255,0.16);
      background: black;
      padding: 2px;
      cursor: pointer;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 1.1rem;
      transform: translateX(-50%);
      z-index: 3;
      color: rgba(255, 255, 255, 0.18);
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 1;
      transition: opacity 600ms ease;
      white-space: nowrap;
    }

    body.has-started .hint {
      opacity: 0.2;
    }

    @media (max-width: 700px) {
      .timer {
        font-size: clamp(4rem, 20vw, 7rem);
        letter-spacing: 0.04em;
      }

      .controls {
        margin-top: 2.5rem;
        flex-wrap: wrap;
      }

      .hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .timer.running {
        animation: none;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="scene"></div>

  <main>
    <div id="timer" class="timer" aria-live="polite">00:00:00</div>

    <div id="controls" class="controls">
      <button id="primaryBtn" type="button">Start</button>
      <button id="againBtn" class="secondary" type="button" hidden>Start Again</button>
    </div>
  </main>

  <section id="settings" class="settings" aria-hidden="true">
    <h2>Night Settings</h2>

    <div class="presets">
      <button class="preset" data-preset="nyc" type="button">1980s New York</button>
      <button class="preset" data-preset="hk" type="button">1990s Hong Kong</button>
      <button class="preset" data-preset="tokyo" type="button">Tokyo After Midnight</button>
      <button class="preset" data-preset="seoul" type="button">Seoul Neon</button>
      <button class="preset" data-preset="london" type="button">London Night Bus</button>
      <button class="preset" data-preset="paris" type="button">Paris Nocturne</button>
      <button class="preset" data-preset="berlin" type="button">Berlin Electric</button>
      <button class="preset" data-preset="mumbai" type="button">Mumbai Monsoon</button>
      <button class="preset" data-preset="neon" type="button">Blue Neon</button>
      <button class="preset" data-preset="amber" type="button">Amber Cab</button>
    </div>

    <div class="row">
      <label for="textColor">Timer</label>
      <input id="textColor" type="color" value="#ff3b1f" />
    </div>

    <div class="row">
      <label for="accentColor">Accent</label>
      <input id="accentColor" type="color" value="#ffcf33" />
    </div>

    <div class="row">
      <label for="secondaryColor">Blue</label>
      <input id="secondaryColor" type="color" value="#2b65ff" />
    </div>
  </section>

  <div class="hint">S stop · H settings</div>

  <script>
    (() => {
      const timerEl = document.getElementById("timer");
      const controlsEl = document.getElementById("controls");
      const primaryBtn = document.getElementById("primaryBtn");
      const againBtn = document.getElementById("againBtn");
      const settingsEl = document.getElementById("settings");

      const textColor = document.getElementById("textColor");
      const accentColor = document.getElementById("accentColor");
      const secondaryColor = document.getElementById("secondaryColor");

      let startTime = 0;
      let elapsed = 0;
      let rafId = null;
      let running = false;
      let stoppedOnce = false;

      const presets = {
        nyc: {
          text: "#ff3b1f",
          accent: "#ffd23f",
          secondary: "#2b65ff"
        },
        hk: {
          text: "#ff164d",
          accent: "#f3d24d",
          secondary: "#19d3ff"
        },
        tokyo: {
          text: "#ff2a6d",
          accent: "#f8f32b",
          secondary: "#00d9ff"
        },
        seoul: {
          text: "#ff4fd8",
          accent: "#7cff6b",
          secondary: "#3a7bff"
        },
        london: {
          text: "#ff304f",
          accent: "#f4c542",
          secondary: "#315cff"
        },
        paris: {
          text: "#ff5f8f",
          accent: "#ffe28a",
          secondary: "#5f6cff"
        },
        berlin: {
          text: "#e9ff38",
          accent: "#ff3fd1",
          secondary: "#36a8ff"
        },
        mumbai: {
          text: "#ff6b1a",
          accent: "#ffd23f",
          secondary: "#00b7ff"
        },
        neon: {
          text: "#35a7ff",
          accent: "#f4f1de",
          secondary: "#7b61ff"
        },
        amber: {
          text: "#ffb000",
          accent: "#ffe082",
          secondary: "#2878ff"
        }
      };

      function hexToRgba(hex, alpha) {
        const clean = hex.replace("#", "");
        const full = clean.length === 3
          ? clean.split("").map(c => c + c).join("")
          : clean;

        const r = parseInt(full.slice(0, 2), 16);
        const g = parseInt(full.slice(2, 4), 16);
        const b = parseInt(full.slice(4, 6), 16);

        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function applyColors(text, accent, secondary) {
        const root = document.documentElement;
        root.style.setProperty("--text", text);
        root.style.setProperty("--accent", accent);
        root.style.setProperty("--secondary", secondary);
        root.style.setProperty("--glow", hexToRgba(text, 0.95));
        root.style.setProperty("--glow-soft", hexToRgba(text, 0.35));

        textColor.value = text;
        accentColor.value = accent;
        secondaryColor.value = secondary;
      }

      function formatTime(ms) {
        const total = Math.floor(ms / 1000);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;

        return [hours, minutes, seconds]
          .map(n => String(n).padStart(2, "0"))
          .join(":");
      }

      function render() {
        timerEl.textContent = formatTime(elapsed);
      }

      function tick(now) {
        if (!running) return;
        elapsed = now - startTime;
        render();
        rafId = requestAnimationFrame(tick);
      }

      function start(fromCurrent = true) {
        if (running) return;

        if (!fromCurrent) {
          elapsed = 0;
          render();
        }

        startTime = performance.now() - elapsed;
        running = true;
        document.body.classList.add("has-started");
        timerEl.classList.add("running");

        controlsEl.classList.add("hidden");
        setTimeout(() => {
          if (running) controlsEl.style.visibility = "hidden";
        }, 220);

        rafId = requestAnimationFrame(tick);
      }

      function stop() {
        if (!running) return;

        running = false;
        stoppedOnce = true;
        cancelAnimationFrame(rafId);
        timerEl.classList.remove("running");

        controlsEl.style.visibility = "visible";
        controlsEl.classList.remove("hidden");

        primaryBtn.textContent = "Reset";
        againBtn.hidden = false;
      }

      function reset() {
        running = false;
        cancelAnimationFrame(rafId);
        elapsed = 0;
        render();
        timerEl.classList.remove("running");

        primaryBtn.textContent = stoppedOnce ? "Reset" : "Start";
        controlsEl.style.visibility = "visible";
        controlsEl.classList.remove("hidden");
      }

      primaryBtn.addEventListener("click", () => {
        if (primaryBtn.textContent === "Start") {
          start(true);
        } else {
          reset();
        }
      });

      againBtn.addEventListener("click", () => {
        start(true);
      });

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (key === "s") {
          stop();
        }

        if (key === "h") {
          const open = settingsEl.classList.toggle("open");
          settingsEl.setAttribute("aria-hidden", String(!open));
        }

        if (key === "escape") {
          settingsEl.classList.remove("open");
          settingsEl.setAttribute("aria-hidden", "true");
        }
      });

      document.querySelectorAll(".preset").forEach(btn => {
        btn.addEventListener("click", () => {
          const p = presets[btn.dataset.preset];
          applyColors(p.text, p.accent, p.secondary);
        });
      });

      textColor.addEventListener("input", () => {
        applyColors(textColor.value, accentColor.value, secondaryColor.value);
      });

      accentColor.addEventListener("input", () => {
        applyColors(textColor.value, accentColor.value, secondaryColor.value);
      });

      secondaryColor.addEventListener("input", () => {
        applyColors(textColor.value, accentColor.value, secondaryColor.value);
      });

      render();
    })();
  </script>
</body>
</html>
